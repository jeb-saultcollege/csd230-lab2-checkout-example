<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
</head>
<body>

<h1>Order Confirmation</h1>

<p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
<p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
<p><strong>Total Amount Paid:</strong> $<span th:text="${order.totalAmount}"></span></p>

<h2>Items Purchased</h2>

<!-- Publications have titles; tickets use descriptions, so render the right label for each. -->
<ul>
    <li th:each="product : ${order.products}">
        <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
              th:text="${product.title}"></span>
        <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
              th:text="${product.description}"></span>
        — $<span th:text="${product.price}"></span>
    </li>
</ul>

<a href="/cart">Return to Cart</a>

</body>
</html>
