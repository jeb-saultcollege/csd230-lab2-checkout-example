services:
  mysql:
    container_name: mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: csd230
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in your local environment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
    ports:
      - "3307:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
